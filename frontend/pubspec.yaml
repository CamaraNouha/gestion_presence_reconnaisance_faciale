name: frontend
description: ENIAD - Système de gestion de présence
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Réseau HTTP
  dio: ^5.4.0

  # Stockage sécurisé (token JWT)
  flutter_secure_storage: ^9.0.0

  # Caméra (pour le pointage)
  camera: ^0.10.5+9

  # Géolocalisation
  geolocator: ^11.0.0

  # Permissions Android
  permission_handler: ^11.3.0

  # Sélection d'image (galerie)
  image_picker: ^1.0.7

  # Sélection de fichiers (CSV/Excel pour import en bloc)
  file_picker: ^8.0.0+1

  # Téléchargement et ouverture de fichiers
  path_provider: ^2.1.2
  open_filex: ^4.3.4

  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true