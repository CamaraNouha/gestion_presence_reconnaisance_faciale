# ============================================================
# CI — ENIAD Présence
# Déclenchée à chaque push sur main et sur chaque pull request.
#
# 3 jobs en parallèle :
#   1. backend-tests  : pytest (GPS, sécurité JWT, moteur facial, API)
#   2. backend-docker : vérifie que l'image Docker se construit
#   3. frontend       : flutter analyze + build APK (artefact)
#
# Le build APK nécessite le secret GOOGLE_SERVICES_JSON
# (contenu du fichier google-services.json, non versionné).
# Sans ce secret, l'étape est sautée proprement.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ──────────────────────────────────────────────────────────
  backend-tests:
    name: Backend — tests pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dépendances système (OpenCV)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Dépendances Python
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Tests unitaires
        run: pytest tests/ -v

  # ──────────────────────────────────────────────────────────
  backend-docker:
    name: Backend — build Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construit l'image
        run: docker build -t eniad-api ./backend

  # ──────────────────────────────────────────────────────────
  frontend:
    name: Frontend — analyse + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances Flutter
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos

      - name: Restaure google-services.json (si secret défini)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json restauré."
          else
            echo "Secret GOOGLE_SERVICES_JSON absent : le build APK sera sauté."
          fi

      - name: Build APK (debug)
        run: |
          if [ -f android/app/google-services.json ]; then
            flutter build apk --debug
          else
            echo "Build APK sauté — ajoutez le secret GOOGLE_SERVICES_JSON."
          fi

      - name: Publie l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: eniad-apk-debug
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14
